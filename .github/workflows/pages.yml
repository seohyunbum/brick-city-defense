name: Quality gate and deploy Brick City

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked development dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Static design, asset and license gate
        run: npm run verify:static

      - name: Full browser smoke
        run: npm run smoke
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          SMOKE_SOAK_MS: '15000'

      - name: Short film smoke
        run: npm run smoke:story
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      - name: Pilot mode smoke
        run: npm run smoke:pilot
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      - name: Keep smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-evidence
          path: |
            .smoke/
            .smoke-story/
            .smoke-pilot/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  deploy:
    needs: quality
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html story.html manifest.webmanifest _site/
          cp -R src vendor _site/
          mkdir -p _site/assets
          cp -R assets/icons _site/assets/
          if [ -d assets/external ]; then cp -R assets/external _site/assets/; fi
          printf '{"commit":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/build-info.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify published build identity
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}build-info.json"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl --fail --silent --show-error "$url" || true)"
            if [[ "$body" == *"$GITHUB_SHA"* ]]; then exit 0; fi
            sleep 10
          done
          echo "Published build did not expose commit $GITHUB_SHA" >&2
          exit 1
